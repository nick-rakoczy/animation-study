name: Linux release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Build, test, and publish AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Set version from tag
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          npm version "$release_version" --no-git-tag-version --allow-same-version
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: npm run dist:linux

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          appimage="release/Animation-Study-${RELEASE_VERSION}-x86_64.AppImage"
          if [ ! -f "$appimage" ]; then
            echo "Expected AppImage was not produced: $appimage" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$appimage" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$appimage" \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
