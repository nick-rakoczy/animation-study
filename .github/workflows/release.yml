name: Linux release

on:
  push:
    branches:
      - main

concurrency:
  group: linux-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Build, test, and publish AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Select the next patch version
        run: |
          base_version="$(node --print "require('./package.json').version")"
          if [[ ! "$base_version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "package.json version must use major.minor.patch: $base_version" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          latest_patch="$({
            git tag --list "$major.$minor.*" "v$major.$minor.*"
          } | sed 's/^v//' | awk -F. '
            $1 == major && $2 == minor && $3 ~ /^[0-9]+$/ {
              if (!found || $3 > maximum) maximum = $3
              found = 1
            }
            END { if (found) print maximum }
          ' major="$major" minor="$minor")"

          if [ -n "$latest_patch" ]; then
            patch="$((latest_patch + 1))"
          else
            patch=0
          fi

          release_version="$major.$minor.$patch"
          release_tag="v$release_version"
          npm version "$release_version" --no-git-tag-version --allow-same-version
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: npm run dist:linux

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          appimage="release/Animation-Study-${RELEASE_VERSION}-x86_64.AppImage"
          update_metadata="release/latest-linux.yml"
          if [ ! -f "$appimage" ]; then
            echo "Expected AppImage was not produced: $appimage" >&2
            exit 1
          fi
          if [ ! -f "$update_metadata" ]; then
            echo "Expected update metadata was not produced: $update_metadata" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$appimage" "$update_metadata" --clobber
          else
            gh release create "$RELEASE_TAG" "$appimage" "$update_metadata" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG"
          fi
